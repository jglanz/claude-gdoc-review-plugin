name: "CI"

# Lint + format + build + jest gate on every PR and default-branch push.

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  checks: write

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # Prettier is not part of eslint here, so a tree that lints clean can
      # still be unformatted. Checking it in CI is what keeps `pnpm format`
      # from producing a diff nobody asked for in the next change.
      - name: Check formatting
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

      - name: Test
        env:
          JEST_JUNIT_OUTPUT_DIR: reports/junit
          JEST_JUNIT_OUTPUT_NAME: jest-junit.xml
        run: pnpm run test:ci

      # Render the JUnit results in the GitHub UI: a check run on the PR plus a
      # per-suite job summary, so nobody has to download the artifact XML.
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: reports/junit/*.xml
          check_name: Jest results
          detailed_summary: true
          include_passed: true
          group_suite: true
          require_tests: true

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-test-results
          path: reports/junit/
          if-no-files-found: ignore
